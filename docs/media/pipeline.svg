<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 470" width="1260" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .t  { font-size: 13px; font-weight: 600; fill: #ffffff; }
      .s  { font-size: 10.5px; fill: #ffffff; fill-opacity: 0.88; }
      .g  { font-size: 13px; font-weight: 600; fill: #8b949e; }
      .gs { font-size: 10.5px; fill: #8b949e; }
      .lane { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #8b949e; }
      .w  { stroke: #8b949e; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .box { rx: 8; ry: 8; }
    </style>
  </defs>

  <!-- film -->
  <rect class="box" rx="8" ry="8" x="20" y="200" width="104" height="80" fill="#3d444d"/>
  <text x="72" y="236" text-anchor="middle" class="t" font-size="15">Film</text>
  <text x="72" y="253" text-anchor="middle" class="s">NFL Pro on screen</text>
  <text x="72" y="266" text-anchor="middle" class="s">or a saved clip</text>
  <path class="w" d="M124 240 C 138 240, 138 70, 150 70"/>
  <path class="w" d="M124 240 C 138 240, 138 180, 150 180"/>
  <path class="w" d="M124 240 C 138 240, 138 290, 150 290"/>
  <path class="w" d="M124 240 C 138 240, 138 400, 150 400"/>

  <!-- lane 1: see the players -->
  <text x="150" y="30" class="lane">SEE THE PLAYERS</text>
  <rect class="box" rx="8" ry="8" x="150" y="41" width="150" height="58" fill="#2f6fed"/>
  <text x="225" y="66" text-anchor="middle" class="t">Detect the players</text>
  <text x="225" y="83" text-anchor="middle" class="s">YOLO11, pretrained</text>
  <path class="w" d="M300 70 L326 70"/>
  <rect class="box" rx="8" ry="8" x="326" y="41" width="150" height="58" fill="#2f6fed"/>
  <text x="401" y="66" text-anchor="middle" class="t">Follow each one</text>
  <text x="401" y="83" text-anchor="middle" class="s">BoT-SORT, through the pans</text>
  <path class="w" d="M476 70 L502 70"/>
  <rect class="box" rx="8" ry="8" x="502" y="41" width="150" height="58" fill="#2f6fed"/>
  <text x="577" y="66" text-anchor="middle" class="t">Split the teams</text>
  <text x="577" y="83" text-anchor="middle" class="s">jersey colour</text>
  <path class="w" d="M652 70 L866 70"/>

  <!-- lane 2: map the field -->
  <text x="150" y="140" class="lane">MAP THE FIELD</text>
  <rect class="box" rx="8" ry="8" x="150" y="151" width="150" height="58" fill="#2e8b57"/>
  <text x="225" y="176" text-anchor="middle" class="t">Find the paint</text>
  <text x="225" y="193" text-anchor="middle" class="s">bright, colourless, thin</text>
  <path class="w" d="M300 180 L326 180"/>
  <rect class="box" rx="8" ry="8" x="326" y="151" width="150" height="58" fill="#2e8b57"/>
  <text x="401" y="176" text-anchor="middle" class="t">Lines and hash marks</text>
  <text x="401" y="193" text-anchor="middle" class="s">one shared vanishing point</text>
  <path class="w" d="M476 180 L502 180"/>
  <rect class="box" rx="8" ry="8" x="502" y="151" width="150" height="58" fill="#2e8b57"/>
  <text x="577" y="176" text-anchor="middle" class="t">Fit the camera</text>
  <text x="577" y="193" text-anchor="middle" class="s">pan, tilt, zoom, followed</text>
  <path class="w" d="M652 180 L678 180"/>
  <rect class="box" rx="8" ry="8" x="678" y="151" width="150" height="58" fill="#2e8b57"/>
  <text x="753" y="176" text-anchor="middle" class="t">Positions in yards</text>
  <text x="753" y="193" text-anchor="middle" class="s">every foot on screen</text>
  <path class="w" d="M828 180 L866 180"/>

  <!-- lane 3: read the play -->
  <text x="150" y="250" class="lane">READ THE PLAY</text>
  <rect class="box" rx="8" ry="8" x="150" y="261" width="150" height="58" fill="#8957e5"/>
  <text x="225" y="286" text-anchor="middle" class="t">Read the header</text>
  <text x="225" y="303" text-anchor="middle" class="s">on-device OCR</text>
  <path class="w" d="M300 290 L326 290"/>
  <rect class="box" rx="8" ry="8" x="326" y="261" width="150" height="58" fill="#8957e5"/>
  <text x="401" y="286" text-anchor="middle" class="t">Find the play</text>
  <text x="401" y="303" text-anchor="middle" class="s">public play-by-play</text>
  <path class="w" d="M476 290 L502 290"/>
  <rect class="box" rx="8" ry="8" x="502" y="261" width="150" height="58" fill="#8957e5"/>
  <text x="577" y="286" text-anchor="middle" class="t">Pin the real yard line</text>
  <text x="577" y="303" text-anchor="middle" class="s">from the painted numbers</text>
  <path class="w" d="M652 290 L866 290"/>

  <!-- lane 4: name the players -->
  <text x="150" y="360" class="lane">NAME THE PLAYERS</text>
  <rect class="box" rx="8" ry="8" x="150" y="371" width="150" height="58" fill="#c0661f"/>
  <text x="225" y="396" text-anchor="middle" class="t">Read the roster</text>
  <text x="225" y="413" text-anchor="middle" class="s">22 names and numbers</text>
  <path class="w" d="M300 400 L326 400"/>
  <rect class="box" rx="8" ry="8" x="326" y="371" width="150" height="58" fill="#c0661f"/>
  <text x="401" y="396" text-anchor="middle" class="t">Read the numbers</text>
  <text x="401" y="413" text-anchor="middle" class="s">a reader trained on this film</text>
  <path class="w" d="M476 400 L502 400"/>
  <rect class="box" rx="8" ry="8" x="502" y="371" width="150" height="58" fill="#c0661f"/>
  <text x="577" y="396" text-anchor="middle" class="t">Remember the look</text>
  <text x="577" y="413" text-anchor="middle" class="s">known again on later plays</text>
  <path class="w" d="M652 400 L866 400"/>

  <!-- collector into the play -->
  <line x1="870" y1="70" x2="870" y2="400" stroke="#8b949e" stroke-width="1.6"/>
  <path class="w" d="M870 235 L900 235"/>

  <!-- work the play out -->
  <rect class="box" rx="8" ry="8" x="900" y="40" width="170" height="400" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-dasharray="4 3"/>
  <text x="985" y="62" text-anchor="middle" class="lane">WORK THE PLAY OUT</text>
  <rect class="box" rx="8" ry="8" x="912" y="76" width="146" height="48" fill="#3d444d"/>
  <text x="985" y="96" text-anchor="middle" class="t">Snap</text>
  <text x="985" y="112" text-anchor="middle" class="s">a still formation moves</text>
  <path class="w" d="M985 124 L985 146"/>
  <rect class="box" rx="8" ry="8" x="912" y="146" width="146" height="48" fill="#3d444d"/>
  <text x="985" y="166" text-anchor="middle" class="t">Roles</text>
  <text x="985" y="182" text-anchor="middle" class="s">QB, receivers, rush, cover</text>
  <path class="w" d="M985 194 L985 216"/>
  <rect class="box" rx="8" ry="8" x="912" y="216" width="146" height="48" fill="#3d444d"/>
  <text x="985" y="236" text-anchor="middle" class="t">Names</text>
  <text x="985" y="252" text-anchor="middle" class="s">number first, then look</text>
  <path class="w" d="M985 264 L985 286"/>
  <rect class="box" rx="8" ry="8" x="912" y="286" width="146" height="48" fill="#3d444d"/>
  <text x="985" y="306" text-anchor="middle" class="t">Pass value</text>
  <text x="985" y="322" text-anchor="middle" class="s">best throw, plus/minus</text>
  <path class="w" d="M985 334 L985 356"/>
  <rect class="box" rx="8" ry="8" x="912" y="356" width="146" height="48" fill="#3d444d"/>
  <text x="985" y="376" text-anchor="middle" class="t">Coverage read</text>
  <text x="985" y="392" text-anchor="middle" class="s">man or zone, the shell</text>

  <!-- outputs -->
  <path class="w" d="M1070 110 L1100 110"/>
  <path class="w" d="M1070 190 L1100 190"/>
  <path class="w" d="M1070 270 L1100 270"/>
  <path class="w" d="M1070 350 L1100 350"/>
  <rect class="box" rx="8" ry="8" x="1100" y="86" width="140" height="48" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <text x="1170" y="106" text-anchor="middle" class="g">Overlay and panel</text>
  <text x="1170" y="122" text-anchor="middle" class="gs">live on the video</text>
  <rect class="box" rx="8" ry="8" x="1100" y="166" width="140" height="48" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <text x="1170" y="186" text-anchor="middle" class="g">Top-down view</text>
  <text x="1170" y="202" text-anchor="middle" class="gs">the play in yards</text>
  <rect class="box" rx="8" ry="8" x="1100" y="246" width="140" height="48" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <text x="1170" y="266" text-anchor="middle" class="g">CSV and play log</text>
  <text x="1170" y="282" text-anchor="middle" class="gs">a row per player per frame</text>
  <rect class="box" rx="8" ry="8" x="1100" y="326" width="140" height="48" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <text x="1170" y="346" text-anchor="middle" class="g">Game table</text>
  <text x="1170" y="362" text-anchor="middle" class="gs">a row per player per play</text>
</svg>
